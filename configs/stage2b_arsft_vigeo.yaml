run:
  name: stage2_arsft_vigeo
  seed: 42
  output_dir: ./outputs/stage2_arsft_vigeo
  log_dir: ./logs/stage2_arsft_vigeo
paths:
  base_transformer: weights/ltx-2.3/ltx-2.3-22b-dev.safetensors
  resume_checkpoint: outputs/stage2a_histpretrain/checkpoint-XXXX-merged
  history_encoder: outputs/stage2a_histpretrain/checkpoint-XXXX-merged/history_encoder.pt
  vae: weights/ltx-2.3/ltx-2.3-22b-dev.safetensors
  gemma: weights/ltx-2.3/google/gemma-3-12b-it-qat-q4_0-unquantized
  video_base_dir: data/Video
  annotation_base_dir: data/Annotation
  resume_reset_step: true
data:
  sources:
    sekai_real_hq: 1.0  # Sekai-Real-Walking-HQ only (18208 clips)
  use_cache: true
  skip_file_check: true
  abstract_caption_prob: 0.0
  require_camera: true
  camera_norm_mode: none
  camera_post_relic_scale: 1.0
  sekai_game_jsonl: null
  sekai_game_pose_subdir: null
sample:
  height: 544
  width: 960
  fps: 24.0
  temporal_stride: 8
layout:
  sink_latent_frames: 1
  max_gap_sec: 0.0
  history_latent_frames: 4
  condition:
    type: nearby
    i2v_prob: 1.0
    v2v_prob: 0.0
    v2v_ratio_min: 0.2
    v2v_ratio_max: 0.6
  output:
    latent_frames:
    - 4
    probs:
    - 1.0
  k4_use_valid_starts: false
  sink_remote: false
  sink_remote_min_distance: 8
memory:
  compress_t: 1
  compress_h: 2
  compress_w: 2
  lr_compress_t: 1
  lr_compress_h: 2
  lr_compress_w: 2
  gate_init: 0.5
  use_self_attn: true
  use_lr_branch: true
  train: true
  drop_prob: 0.5
spatial_memory:
  enabled: true
  context_mode: vigeo_prefix_last_frame
  depth_backend: vigeo
  vigeo_repo_path: third_party/ViGeo
  vigeo_checkpoint: third_party/ViGeo/checkpoints/ViGeo1.1
  vigeo_device: auto
  vigeo_num_tokens: 1369
  vigeo_stream_chunk_size: 16
  vigeo_cache_budget: 262144
  vigeo_single_frame_scale: 1.0
  vigeo_generated_source_pose_mode: aligned_vigeo
  vigeo_prefix_frames: 24
  use_warped_context: true
  retrieval_max_coverage: true
  retrieval_depth_threshold: 0.1
  num_context_frames: 10
  require_full_context: true
  retrieval_views: 1
  cache_stride: 1
  skip_recent_latents: 1
  downsample: 4
  dropout: 0.0
  constant_depth: 1.0
  include_sink: false
  include_nearby: true
control:
  candidates:
  - []
  probs:
  - 1.0
  action_learning_rate: null
training:
  mode: sft
  adaptive_sigma_shift: true
  adaptive_shift_m_lo: 3.0
  adaptive_shift_m_hi: 30.0
  adaptive_shift_frame_lo: 8
  adaptive_shift_frame_hi: 121
validation:
  enabled: true
  before_train: true
  interval: 600
  first_step: 0
  max_samples: 2
  dynamic_rounds: true
  sampling_steps: 30
  scheduler: shift
  cfg_scale: 3.0
  stg_scale: 1.0
  stg_blocks:
  - 28
  rescale_scale: 0.7
  save_videos: true
  save_joystick: true
  vigeo_handoff_mode: direct_latent
  vigeo_pred_decode_mode: full
  video_history_latent_frames: 4
  modes:
    i2v_action_rollout_scene_sekai_real:
      dataset:
        source: sekai_real_hq
      layout:
        condition: i2v
        output_latent_frames: 4
        condition_latent_frames: 1
        history_latent_frames: 4
        max_gap_sec: 0.0
        height: 544
        width: 960
      control: []
      rollout_rounds: 5
      memory_start_round: 1
anti_drift:
  drift:
    enabled: true
    noise_mode_prob: 0.9
    corrupt_ratio: 0.333
    clean_prob: 0.1
    history_corrupt_prob: null
    condition_prefix_last_context_frame_prob: 0.0
    downsample_min: 0.9
    downsample_max: 1.0
    saturation_clean_prob: 0.1
    keep_x0: false
  error_bank:
    enabled: true
    buffer_k: 500
    num_grids: 50
    warmup_iter: 240
    target_latent_prob: 0.9
    bank_skip_prob: 0.2
    clean_buffer_update_prob: 0.1
    replacement_strategy: l2_batch
    gamma: 1.0
    history_prob: 0.0
    spatial_prob: 0.9
    nearby_prob: 0.9
    modulate_factor: 0.2
next_forcing:
  enabled: true
  hook_layers:
  - 8
  - 20
  - 32
  - 44
  num_blocks: 3
  loss_weight: 0.5
  sigma_shift: 10.0
  fuse_hidden_mult: 1.0
lora:
  enabled: false
  train: false
  rank: 128
  alpha: 128
  targets:
  - attn1.to_q
  - attn1.to_k
  - attn1.to_v
  - attn1.to_out.0
  - attn2.to_q
  - attn2.to_k
  - attn2.to_v
  - attn2.to_out.0
  - ff.net.0.proj
  - ff.net.2
optimizer:
  batch_size: 1
  lr: 5.0e-05
  weight_decay: 0.001
  epochs: 5000
  max_grad_norm: 5.0
  warmup_steps: 300
  checkpoint_steps: 300
  max_checkpoints: 10
  log_steps: 1
  max_steps: null
runtime:
  dtype: bf16
  text_embed_cache_entries: 4096
  text_embed_cache_dir: cache/text_embed_ltx23
  precache_text_embeds: false
  vae_latent_cache_dir: cache/vae_latent_ltx23_544x960
  attention_type: flash_attention_3
  gradient_checkpointing: true
  vae_chunk_size: 33
  vae_decode_chunk_latents: 161
  dataloader_workers: 2
  dataloader_pin_memory: false
  dataloader_prefetch_factor: 2
  fsdp: true
  norm_by_fps: true
  norm_by_max_frames: true
  positional_embedding_max_pos: 20,2048,2048
  compact_spatial_tokens: true
