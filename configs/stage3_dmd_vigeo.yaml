anti_drift:
  drift:
    clean_prob: 0.1
    condition_prefix_last_context_frame_prob: 0.0
    corrupt_ratio: 0.333
    downsample_max: 1.0
    downsample_min: 0.9
    enabled: false
    history_corrupt_prob: null
    keep_x0: false
    noise_mode_prob: 0.9
    saturation_clean_prob: 0.1
  error_bank:
    bank_skip_prob: 0.2
    buffer_k: 500
    clean_buffer_update_prob: 0.1
    enabled: false
    gamma: 1.0
    history_prob: 0.9
    modulate_factor: 0.2
    nearby_prob: 0.9
    num_grids: 50
    replacement_strategy: l2_batch
    spatial_prob: 0.9
    target_latent_prob: 0.9
    warmup_iter: 240
control:
  action_learning_rate: null
  candidates:
  - []
  probs:
  - 1.0
data:
  abstract_caption_prob: 0.0
  camera_norm_mode: none
  camera_post_relic_scale: 1.0
  require_camera: true
  sekai_game_jsonl: null
  sekai_game_pose_subdir: null
  skip_file_check: true
  sources:
    sekai_real_hq: 1.0  # Sekai-Real-Walking-HQ only (18208 clips)
  use_cache: true
dmd:
  cm_reg:
    dmd_warmup_steps: 0
    ema_start_step: 200
    ema_weight: 0.99
    enabled: true
    every: 1
    huber_c: 0.001
    loss_type: huber
    num_scales: 50
    sigma_max: 1.0
    sigma_min: 0.0
    use_ema: true
    weight: 0.7
  critic_lora_alpha: 256.0
  critic_lora_rank: 256
  critic_lora_targets: null
  critic_lr: 5.0e-05
  dfake_gen_update_ratio: 10
  dmd_sigma_list:
  - 1.0
  - 0.75
  - 0.5
  - 0.25
  enabled: true
  gan_cond_map_dim: 768
  gan_d_weight: 0.01
  gan_g_weight: 0.01
  gan_hooks:
  - 8
  - 20
  - 32
  - 44
  gan_start_step: 0
  is_use_gan: false
  last_step_only: false
  max_inner_sigma: 0.98
  min_inner_sigma: 0.15
  negative_prompt: null
  r1_sigma: 0.1
  r1_weight: 0.0
  r2_sigma: 0.1
  r2_weight: 0.0
  real_guidance_scale: 2.0
  self_rollout:
    enabled: true
    max_chunks: 15
    min_depth: 0
    reuse_spatial_bank: false
    score_context_free: false
    score_gt_context: true
    window_chunks: 3
    window_full_grad: true
    vigeo_seed: true
    round0_no_memory: true
  shard_score_model: true
layout:
  condition:
    i2v_prob: 1.0
    type: nearby
    v2v_prob: 0.0
    v2v_ratio_max: 0.6
    v2v_ratio_min: 0.2
  history_latent_frames: 4
  k4_use_valid_starts: false
  max_gap_sec: 0.0
  output:
    latent_frames:
    - 4
    - 30
    probs:
    - 1.0
    - 0.0
  sink_latent_frames: 1
  sink_remote: false
  sink_remote_min_distance: 8
lora:
  alpha: 256
  enabled: true
  rank: 256
  targets:
  - attn1.to_q
  - attn1.to_k
  - attn1.to_v
  - attn1.to_out.0
  - attn2.to_q
  - attn2.to_k
  - attn2.to_v
  - attn2.to_out.0
  - ff.net.0.proj
  - ff.net.2
  train: true
memory:
  compress_h: 2
  compress_t: 1
  compress_w: 2
  drop_prob: 0.0
  gate_init: 0.5
  lr_compress_h: 2
  lr_compress_t: 1
  lr_compress_w: 2
  train: false
  use_lr_branch: true
  use_self_attn: true
next_forcing:
  enabled: false
  fuse_hidden_mult: 1.0
  hook_layers:
  - 8
  - 20
  - 32
  - 44
  loss_weight: 0.5
  num_blocks: 3
  sigma_shift: 10.0
optimizer:
  batch_size: 1
  checkpoint_steps: 300
  epochs: 5000
  log_steps: 1
  lr: 1.0e-05
  max_checkpoints: 10
  max_grad_norm: 5.0
  max_steps: null
  warmup_steps: 100
  weight_decay: 0.001
paths:
  annotation_base_dir: data/Annotation
  base_transformer: weights/ltx-2.3/ltx-2.3-22b-dev.safetensors
  dmd_resume: null
  gemma: weights/ltx-2.3/google/gemma-3-12b-it-qat-q4_0-unquantized
  history_encoder: outputs/stage2b_arsft_vigeo/checkpoint-XXXXX/history_encoder.pt
  real_score_model: null
  resume_checkpoint: outputs/stage2b_arsft_vigeo/checkpoint-XXXXX
  resume_reset_step: true
  vae: weights/ltx-2.3/ltx-2.3-22b-dev.safetensors
  video_base_dir: data/Video
run:
  name: stage3_dmd_vigeo
  seed: 42
  output_dir: ./outputs/stage3_dmd_vigeo
  log_dir: ./logs/stage3_dmd_vigeo
runtime:
  attention_type: flash_attention_3
  compact_spatial_tokens: true
  dataloader_pin_memory: false
  dataloader_prefetch_factor: 2
  dataloader_workers: 2
  dtype: bf16
  fsdp: true
  gradient_checkpointing: true
  norm_by_fps: true
  norm_by_max_frames: true
  positional_embedding_max_pos: 20,2048,2048
  precache_text_embeds: false
  text_embed_cache_dir: cache/text_embed_ltx23
  text_embed_cache_entries: 4096
  vae_chunk_size: 33
  vae_decode_chunk_latents: 161
  vae_latent_cache_dir: cache/vae_latent_ltx23_544x960
sample:
  fps: 24.0
  height: 544
  temporal_stride: 8
  width: 960
spatial_memory:
  cache_stride: 1
  constant_depth: 1.0
  context_mode: vigeo_prefix_last_frame
  depth_backend: vigeo
  downsample: 4
  dropout: 0.0
  enabled: true
  include_nearby: true
  include_sink: false
  num_context_frames: 10
  require_full_context: true
  retrieval_depth_threshold: 0.1
  retrieval_max_coverage: true
  retrieval_views: 1
  skip_recent_latents: 1
  use_warped_context: true
  vigeo_cache_budget: 262144
  vigeo_checkpoint: third_party/ViGeo/checkpoints/ViGeo1.1
  vigeo_device: auto
  vigeo_generated_source_pose_mode: aligned_vigeo
  vigeo_num_tokens: 1369
  vigeo_prefix_frames: 24
  vigeo_repo_path: third_party/ViGeo
  vigeo_single_frame_scale: 1.0
  vigeo_stream_chunk_size: 16
training:
  adaptive_shift_frame_hi: 121
  adaptive_shift_frame_lo: 8
  adaptive_shift_m_hi: 30.0
  adaptive_shift_m_lo: 3.0
  adaptive_sigma_shift: true
  mode: lora
validation:
  before_train: false
  cfg_scale: 1.0
  dynamic_rounds: true
  enabled: true
  first_step: 100
  interval: 500
  max_samples: 1
  modes:
    i2v_action_rollout_sekai_hq:
      control: []
      dataset:
        source: sekai_real_hq
      layout:
        condition: i2v
        condition_latent_frames: 1
        height: 544
        history_latent_frames: 4
        max_gap_sec: 0.0
        output_latent_frames: 4
        width: 960
      rollout_rounds: 5
      memory_start_round: 1
  rescale_scale: 0.0
  sampling_steps: 4
  save_joystick: true
  save_videos: true
  scheduler: uniform
  stg_blocks: []
  stg_scale: 1.0
  video_history_latent_frames: 4
  vigeo_handoff_mode: direct_latent
  vigeo_pred_decode_mode: full
