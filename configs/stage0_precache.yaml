# stage0: cache prebuild (no training).
# Derived from stage1_pretrain_bidir.yaml. Data sources, resolution, fps and cache dirs must
# match the real training run, otherwise the cache keys will not match.
# Run: bash scripts/finetune/stage0_precache.sh [--limit N]
run:
  name: stage0_precache
  seed: 42
  output_dir: outputs/stage0_precache
  log_dir: ./logs/stage0_precache
paths:
  base_transformer: weights/ltx-2.3/ltx-2.3-22b-dev.safetensors
  vae: weights/ltx-2.3/ltx-2.3-22b-dev.safetensors
  gemma: weights/ltx-2.3/google/gemma-3-12b-it-qat-q4_0-unquantized
  video_base_dir: data/Video
  annotation_base_dir: data/Annotation
data:
  sources:
    sekai_real_hq: 1.0
  overall_caption_prob: 0.1
  camera_drop_content_prob: 0.1
  use_cache: true
  skip_file_check: true
  abstract_caption_prob: 0.0
  require_camera: false
  camera_norm_mode: none
  camera_post_relic_scale: 1.0
sample:
  height: 544
  width: 960
  fps: 24.0
  temporal_stride: 8
layout:
  sink_latent_frames: 0
  max_gap_sec: 0.0
  history_latent_frames: 0
  variable_length: true
  condition:
    type: inline
    i2v_prob: 0.7
    v2v_prob: 0.2
    v2v_ratio_min: 0.2
    v2v_ratio_max: 0.6
  output:
    latent_frames:
    - 61
    probs:
    - 1.0
training:
  mode: sft
  adaptive_sigma_shift: true
  adaptive_shift_m_lo: 5.0
  adaptive_shift_m_hi: 30.0
  adaptive_shift_frame_lo: 8
  adaptive_shift_frame_hi: 121
lora:
  enabled: false
optimizer:
  batch_size: 1
  lr: 1.0e-05
  weight_decay: 0.001
  epochs: 100
  max_grad_norm: 1.0
  warmup_steps: 200
  checkpoint_steps: 500
  max_checkpoints: 10
  log_steps: 1
  max_steps: 0
validation:
  enabled: false
  before_train: false
  interval: 500
  first_step: 0
  max_samples: 1
  dynamic_rounds: true
  sampling_steps: 30
  scheduler: shift
  cfg_scale: 3.0
  stg_scale: 1.0
  stg_blocks:
  - 28
  rescale_scale: 0.7
  save_videos: true
  save_joystick: false
  video_history_latent_frames: 0
  modes:
    i2v_gen_sekai_hq:
      dataset:
        source: sekai_real_hq
      layout:
        condition: i2v
        output_latent_frames: 21
        condition_latent_frames: 1
        history_latent_frames: 0
        max_gap_sec: 0.0
        height: 544
        width: 960
      control: []
      rollout_rounds: 1
runtime:
  dtype: bf16
  text_embed_cache_entries: 4096
  text_embed_cache_dir: cache/text_embed_ltx23
  precache_text_embeds: true
  vae_latent_cache_dir: cache/vae_latent_ltx23_544x960
  attention_type: flash_attention_3
  gradient_checkpointing: true
  vae_chunk_size: 33
  dataloader_workers: 2
  dataloader_pin_memory: false
  dataloader_prefetch_factor: 2
  fsdp: true
  norm_by_fps: true
  norm_by_max_frames: true
  positional_embedding_max_pos: 20,2048,2048
