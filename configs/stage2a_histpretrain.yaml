# ============================================================================
# Stage 2a: history pretraining (frame-query) — trains the HistoryEncoder plus LoRA.
#
# Objective: reconstruct Omega latent frames inside a masked history window
# (masked autoencoding) via FrameQueryTrainer (frame_query.enabled=true).
# The base transformer stays frozen; only the HistoryEncoder and LoRA are trained.
# resume_checkpoint should point at the stage1 checkpoint (leave empty to start from base).
# Run: python -m alaya.train --config configs/stage2a_histpretrain.yaml
# ============================================================================

run:
  name: stage2a_histpretrain
  seed: 42
  output_dir: ./outputs/stage2a_histpretrain
  log_dir: ./logs/stage2a_histpretrain

paths:
  base_transformer: weights/ltx-2.3/ltx-2.3-22b-dev.safetensors
  # Point this at the stage1 output checkpoint directory
  resume_checkpoint:
  vae: weights/ltx-2.3/ltx-2.3-22b-dev.safetensors
  gemma: weights/ltx-2.3/google/gemma-3-12b-it-qat-q4_0-unquantized
  video_base_dir: data/Video
  annotation_base_dir: data/Annotation

data:
  # Sekai-Real-Walking-HQ only
  sources:
    sekai_real_hq: 1.0
  overall_caption_prob: 0.1  # 10% whole-clip captions, 90% per-segment captions
  camera_drop_content_prob: 0.1  # probability of dropping the camera description from the prompt
  use_cache: true
  skip_file_check: true
  abstract_caption_prob: 0.0
  require_camera: false
  camera_norm_mode: none
  camera_post_relic_scale: 1.0

sample:
  height: 544
  width: 960
  fps: 24.0
  temporal_stride: 8

layout:
  sink_latent_frames: 0
  max_gap_sec: 0.0
  history_latent_frames: 60  # 20s of history at 8x temporal compression
  # Variable-length: short segments train at their natural length and history is
  # clamped to min(60, T_lat); whole-clip samples get the full 20s.
  variable_length: true
  condition:
    type: nearby
    i2v_prob: 0.0  # frame-query does not use i2v/v2v conditioning
    v2v_prob: 0.0
    v2v_ratio_min: 0.2
    v2v_ratio_max: 0.6
  output:
    latent_frames: [4]  # only drives how many frames the dataloader loads; Omega is sampled by frame_query.omega_*
    probs: [1.0]

memory:
  compress_t: 1
  compress_h: 2
  compress_w: 2
  lr_compress_t: 1
  lr_compress_h: 2
  lr_compress_w: 2
  gate_init: 0.5  # must be > 0: a zero gate blocks gradients into the HistoryEncoder
  use_self_attn: true
  use_lr_branch: true
  train: true  # train the HistoryEncoder
  drop_prob: 0.0

frame_query:
  enabled: true
  omega_sizes: [1, 2, 4]  # candidate Omega sizes in latents (0.33s / 0.67s / 1.33s)
  omega_probs: [0.1, 0.3, 0.6]  # sampling probabilities for omega_sizes
  mask_sigma_min: 0.2  # non-Omega frames are noised with sigma ~ U(mask_sigma_min, 1.0)
  mask_sigma_max: 1.0

training:
  mode: lora  # base frozen; train LoRA + HistoryEncoder
  # The adaptive-shift fields below are unused by frame_query (it uses uniform sigma);
  adaptive_sigma_shift: true
  adaptive_shift_m_lo: 5.0
  adaptive_shift_m_hi: 30.0
  adaptive_shift_frame_lo: 8
  adaptive_shift_frame_hi: 121

lora:
  enabled: true
  train: true
  rank: 256
  alpha: 256
  targets:
    - "blocks."  # substring match: every Linear inside the transformer blocks

optimizer:
  batch_size: 1
  lr: 5.0e-5
  weight_decay: 0.001
  epochs: 500
  max_grad_norm: 5.0
  warmup_steps: 100
  checkpoint_steps: 2000
  max_checkpoints: 10
  log_steps: 1
  max_steps:

validation:
  enabled: true  # frame-query reconstruction eval (FrameQueryTrainer has its own validate)
  before_train: true  # emit a baseline reconstruction before training (GT | recon side-by-side mp4)
  interval: 500
  first_step: 0
  max_samples: 2
  sampling_steps: 30  # denoising steps used by the reconstruction eval

runtime:
  dtype: bf16
  text_embed_cache_entries: 4096  # in-process LRU for text embeddings (0 = off); a hit skips the text encoder
  text_embed_cache_dir: cache/text_embed_ltx23  # on-disk text-embedding cache, shared across stages and restarts
  precache_text_embeds: false  # false = fill the disk cache lazily during training (a miss writes through)
  vae_latent_cache_dir: cache/vae_latent_ltx23_544x960  # whole-clip latent cache: the first 17 latents are encoded fresh, the tail is sliced from cache
  attention_type: flash_attention_3
  gradient_checkpointing: true
  vae_chunk_size: 33
  dataloader_workers: 2
  dataloader_pin_memory: false
  dataloader_prefetch_factor: 2
  fsdp: true
  norm_by_fps: true
  norm_by_max_frames: true
  positional_embedding_max_pos: 20,2048,2048
